---
name: Backend Test

on:
  workflow_call:
    inputs:
      backend:
        description: 'FlagGems backend label (e.g. nvidia-cuda133, mthreads-musa520, ascend-cann900)'
        required: true
        type: string
      runner_label:
        description: 'GitHub Actions runner label'
        required: true
        type: string
      gpu_check_script:
        description: 'Path to GPU check script (leave empty to skip)'
        required: false
        type: string
        default: ''
      changed_files:
        description: 'List of changed files in a PR'
        required: false
        type: string
        default: ''
      pr_id:
        description: 'ID of the PR'
        required: false
        type: string
        default: ''
      test_script:
        description: "Temporary parameter for alpha-ops test"
        required: false
        type: string
        default: ''
    secrets:
      RUNNER_SSH_KEY:
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.runner_label }}
    # PPU LLVM output requires the SDK 2.1 toolchain validated by this image.
    container: >-
      ${{ inputs.backend == 'thead' && fromJSON('{"image":"egslingjun-registry.cn-wulanchabu.cr.aliyuncs.com/egslingjun/inference-xpu-pytorch@sha256:c61fa9b82e2909b49d485688688d6c95779b0f0eb3e1cb8e9d76e3c49abadb9c","options":"--device=/dev/alixpu --device=/dev/alixpu_ctl --device=/dev/alixpu_ppu0"}') || null }}
    concurrency:
      group: >-
        op-test-${{ inputs.backend }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        continue-on-error: true
      - uses: ./.github/actions/checkout-retry
      - name: Set up the PPU SDK image
        if: inputs.backend == 'thead'
        shell: bash
        run: |
          bash tools/setup-thead-ci.sh
          source .venv/bin/activate
          gpu_output=$(bash tools/gpu_check_thead.sh)
          echo "$gpu_output"
          available_gpus=$(echo "$gpu_output" | grep '^Available GPUs:' | cut -d: -f2 | tr -d ' ')
          echo "AVAILABLE_GPUS=$available_gpus" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-flaggems
        if: inputs.backend != 'thead'
        with:
          backend: ${{ inputs.backend }}
          gpu_check_script: ${{ inputs.gpu_check_script }}

      - name: Test alpha ops
        if: ${{ inputs.test_script != '' }}
        env:
          CHANGED_FILES: ${{ inputs.changed_files }}
        shell: bash
        run: |
          bash ${{ inputs.test_script }} ${{ inputs.backend }} ${{ inputs.pr_id }}
      - name: Run backend tests
        if: ${{ inputs.test_script == '' }}
        shell: bash
        env:
          CHANGED_FILES: ${{ inputs.changed_files }}
        run: |
          source .venv/bin/activate
          tools/test-op.sh ${{ inputs.pr_id }}
